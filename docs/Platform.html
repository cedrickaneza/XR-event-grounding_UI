<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XR Event Grounding · Platform</title>

  <link rel="stylesheet" href="src/lattice-tokens.css" />
  <link rel="stylesheet" href="src/styles.css" />
  <link rel="stylesheet" href="src/live-graph.css" />
</head>
<body>
  <div id="root" class="app"></div>

  <!-- Data first (no JSX) -->
  <script src="data/graph-data.js"></script>

  <!-- Logic layer (vanilla JS) -->
  <script src="src/graph-store.js"></script>
  <script src="src/retriever.js"></script>
  <script src="src/prompts.js"></script>
  <script src="src/providers.js"></script>
  <script src="src/conv-agent.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- UI -->
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/graph-viz.jsx"></script>
  <script type="text/babel" src="src/live-graph.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <!-- Tweakable defaults — host writes back here on __edit_mode_set_keys -->
  <script>
    window.LG_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "stagger_s": 0.2,
      "show_dots": true,
      "show_phase_bands": true,
      "show_playhead": true,
      "show_edge_labels": true,
      "active_glow": "breathing",
      "palette": "warm"
    }/*EDITMODE-END*/;
  </script>
</body>
</html>
